name: Requests Visual Proof

on:
  push:
    branches:
      - ui/requests-future-industrial-v1

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test requests surface
        run: pnpm exec vitest run src/surfaces/RequestsPage.test.tsx

      - name: Build
        run: pnpm build

      - name: Install Playwright locally for visual proof
        run: |
          pnpm add -Dw playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Start production frontend preview
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 > /tmp/workos-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/workos-vite.log
          exit 1

      - name: Capture requests visual states
        run: |
          cat > capture-requests.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";
          import assert from "node:assert/strict";

          const out = "artifacts/requests-intake-v6";
          await fs.mkdir(out, { recursive: true });

          const session = {
            mode: "cloud",
            user: { userId: "usr:review", email: "owner@workos.test" },
            organization: {
              organizationId: "org:review",
              displayName: "HUB MEDIA · REVIEW",
              slug: "hub-media-review",
              role: "owner",
            },
            memberships: [
              {
                organizationId: "org:review",
                displayName: "HUB MEDIA · REVIEW",
                slug: "hub-media-review",
                role: "owner",
                status: "ACTIVE",
              },
            ],
          };

          const requests = [
            {
              requestId: "req-1",
              title: "Litere volumetrice — PURE CLIMATE SOLUTIONS",
              reference: "CER-E5D190D8",
              customerId: "cus-1",
              customerDisplayName: "PURE CLIMATE SOLUTIONS S.R.L.",
              status: "NEW",
              statusLabel: "Nouă",
              commercialProgressLabel: "Fără ofertă",
              createdAt: "2026-10-06T08:42:00.000Z",
              nextAction: "CHOOSE_PRODUCT",
              nextActionLabel: "Alege produs",
              needsAttention: true,
              attentionLabel: "Necesită configurare",
            },
            {
              requestId: "req-2",
              title: "Casetă luminoasă fațadă",
              reference: "CER-4A71B902",
              customerId: "cus-2",
              customerDisplayName: "NORD MARKET SRL",
              status: "NEW",
              statusLabel: "Nouă",
              commercialProgressLabel: "Ofertă creată",
              createdAt: "2026-10-05T13:18:00.000Z",
              nextAction: "OPEN_QUOTE",
              nextActionLabel: "Deschide oferta",
              nextActionHref: "/quotes/qts%3APRD-ACM-CASSETTE-NONE%3Areview",
              needsAttention: true,
              attentionLabel: "Urmează oferta",
              linkedQuoteSnapshotId: "qts:PRD-ACM-CASSETTE-NONE:review",
              linkedQuoteProductCode: "PRD-ACM-CASSETTE-NONE",
            },
            {
              requestId: "req-3",
              title: "Colantare vitrină",
              reference: "CER-8C21D4F1",
              customerId: "cus-3",
              customerDisplayName: "MAISON 51",
              status: "NEW",
              statusLabel: "Nouă",
              commercialProgressLabel: "În lucru",
              createdAt: "2026-10-04T09:06:00.000Z",
              nextAction: "OPEN_REQUEST",
              nextActionLabel: "Deschide",
              needsAttention: false,
            },
            {
              requestId: "req-4",
              title: "Totem dublă față",
              reference: "CER-73BF104A",
              customerId: "cus-4",
              customerDisplayName: "CARDIO NEURO CONSULT",
              status: "NEW",
              statusLabel: "Nouă",
              commercialProgressLabel: "Fără ofertă",
              createdAt: "2026-10-02T15:44:00.000Z",
              nextAction: "OPEN_REQUEST",
              nextActionLabel: "Deschide",
              needsAttention: false,
            },
          ];

          const browser = await chromium.launch({ headless: true });

          const assetEvidence = [];
          const geometryEvidence = [];
          async function anchors(page) {
            return page.evaluate(() => Object.fromEntries([
              ".app-shell__brand", ".app-shell__nav", ".app-shell__route", ".app-shell__account",
              ".page-header", ".requests-toolbar", ".requests-table thead",
            ].map((selector) => {
              const { x, y, width, height } = document.querySelector(selector).getBoundingClientRect();
              return [selector, { x, y, width, height }];
            })));
          }
          function assertStable(before, after) {
            for (const selector of Object.keys(before)) {
              for (const axis of ["x", "y", "width", "height"]) {
                assert.ok(Math.abs(before[selector][axis] - after[selector][axis]) < 0.5,
                  `Filter moved ${selector} ${axis}: ${before[selector][axis]} -> ${after[selector][axis]}`);
              }
            }
          }
          async function shot(name, width, height, scheme, deviceScaleFactor = 1, stress = false) {
            const context = await browser.newContext({
              timezoneId: "Europe/Bucharest",
              viewport: { width, height },
              colorScheme: scheme,
              deviceScaleFactor,
            });
            await context.addInitScript((value) => {
              localStorage.setItem("workos-color-scheme", value);
            }, scheme);
            const page = await context.newPage();
            const errors = [];
            const imageResponses = [];
            page.on("response", (response) => {
              if (response.url().includes("request-intake") && new URL(response.url()).pathname.endsWith(".webp")) imageResponses.push(response);
            });
            const textureResponse = width >= 768 ? page.waitForResponse((response) => response.url().includes("request-intake-surface") && new URL(response.url()).pathname.endsWith(".webp")) : null;
            page.on("pageerror", (error) => errors.push(error.message));
            page.on("console", (message) => { if (message.type() === "error") errors.push(message.text()); });

            await page.route("http://127.0.0.1:4173/api/**", async (route) => {
              const url = route.request().url();
              if (url.endsWith("/api/cloud/session")) {
                const body = stress ? { ...session, organization: { ...session.organization,
                  displayName: "HUB MEDIA PRODUCTION SI SERVICII PUBLICITARE S.R.L." } } : session;
                await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(body) });
                return;
              }
              if (url.endsWith("/api/health")) {
                await route.fulfill({
                  status: 200,
                  contentType: "application/json",
                  body: JSON.stringify({ status: "ok", service: "workos-final-api", apiContractId: "workos-ui-contract-v1" }),
                });
                return;
              }
              if (url.endsWith("/api/requests")) {
                await route.fulfill({
                  status: 200,
                  contentType: "application/json",
                  body: JSON.stringify({ overview: { requests: stress ? requests.map((item, index) => index === 0 ? {
                    ...item,
                    title: "Litere volumetrice pentru intrarea principala si receptia centrului de prezentare PURE CLIMATE SOLUTIONS",
                    customerDisplayName: "PURE CLIMATE SOLUTIONS PRODUCTIE SI SERVICII INDUSTRIALE S.R.L.",
                  } : item) : requests } }),
                });
                return;
              }
              await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({}) });
            });

            await page.goto("http://127.0.0.1:4173/cereri", { waitUntil: "domcontentloaded" });
            await page.getByRole("heading", { name: "Cereri de ofertă" }).waitFor();
            await page.getByRole("link", { name: /CER-E5D190D8/ }).waitFor();
            await page.evaluate(() => document.fonts.ready);
            if (width >= 768) await page.locator(".requests-intake img").evaluate((img) => img.decode());
            if (width >= 768) await page.evaluate(() => {
              const header = document.querySelector('[data-surface="cereri-registry"] > .page-header');
              const surface = getComputedStyle(header, "::after");
              const imageUrl = surface.backgroundImage.match(/url\(["']?(.*?)["']?\)/)?.[1];
              if (!imageUrl?.includes("request-intake-surface")) throw new Error("Missing selected demo surface texture");
            });
            if (width >= 768) await page.locator(".requests-intake").evaluate(async (intake) => {
              // The decorative intake is intentionally hidden on phone layouts.
              if (intake.getClientRects().length === 0) return;
              const animations = intake.getAnimations({ subtree: true })
                .filter((animation) => Number.isFinite(animation.effect.getComputedTiming().iterations));
              await Promise.all(animations.map((animation) => animation.finished.catch(() => {})));
              const sheet = intake.querySelector(".requests-intake__sheet");
              if (getComputedStyle(sheet).opacity !== "1") throw new Error("Receipt captured before its entrance completed");
              const device = intake.querySelector(".requests-intake__device").getBoundingClientRect();
              if (Math.abs(device.width / device.height - 3.77) > 0.05) throw new Error("Intake aspect ratio collapsed in responsive layout");
              if (sheet.getBoundingClientRect().height < 40) throw new Error("Receipt text container has no usable height");
            });
            assert.equal(await page.getByRole("button", { name: "Următor" }).isDisabled(), true);
            assert.equal(await page.getByRole("button", { name: "Anterior" }).isDisabled(), true);
            assert.equal(await page.evaluate(() => document.documentElement.scrollWidth > innerWidth), false, `Overflow at ${width}`);
            const geometry = await page.evaluate(() => {
              const buttons = [...document.querySelectorAll(".requests-next")].map((button) => {
                const rect = button.getBoundingClientRect();
                return { label: button.textContent.trim(), width: rect.width, height: rect.height };
              });
              const sheet = document.querySelector(".requests-intake__sheet");
              const children = sheet ? [...sheet.children].filter((child) => getComputedStyle(child).display !== "none") : [];
              return { buttons, sheet: sheet ? {
                height: sheet.clientHeight, scrollHeight: sheet.scrollHeight,
                visibleLinesFit: children.every((child) => child.getBoundingClientRect().bottom <= sheet.getBoundingClientRect().bottom + 1),
                fontFamily: getComputedStyle(sheet).fontFamily,
              } : null, account: document.querySelector(".account-area__trigger").getBoundingClientRect().height };
            });
            for (const button of geometry.buttons) {
              assert.equal(button.width, width < 768 ? 148 : 160, `Nonstandard action width at ${width}: ${button.label}`);
              assert.equal(button.height, 44, `Nonstandard action height at ${width}: ${button.label}`);
            }
            assert.ok(geometry.account >= 44, "Account target smaller than 44px");
            if (geometry.sheet) {
              assert.ok(geometry.sheet.scrollHeight <= geometry.sheet.height + 1, `Clipped receipt at ${width}`);
              assert.equal(geometry.sheet.visibleLinesFit, true, `Receipt line outside paper at ${width}`);
              assert.match(geometry.sheet.fontFamily, /IBM Plex Mono/);
            }
            geometryEvidence.push({ name, width, stress, ...geometry });
            await page.screenshot({ path: `${out}/${name}.png`, fullPage: true });
            if (textureResponse) await (await textureResponse).finished();
            // Read bytes already received by Chromium; this makes no extra image request.
            const assets = await Promise.all(imageResponses.map(async (response) => ({
              url: response.url(), bytes: (await response.body()).length, status: response.status(),
            })));
            assetEvidence.push({ name, width, deviceScaleFactor, assets });
            if (width >= 768) {
              assert.equal(assets.length, 2, "Decoration fetched more than once");
              assert.equal(assets.reduce((sum, asset) => sum + asset.bytes, 0), deviceScaleFactor === 2 ? 109914 : 43144);
            }
            if (width < 768) {
              assert.equal(await page.locator(".requests-intake img").count(), 0);
              assert.equal(assets.length, 0, "Phone downloaded hidden decoration");
              assert.equal(await page.locator("tbody tr[tabindex]").count(), 0);
            } else {
              assert.equal(await page.locator(".requests-intake img").evaluate((img) => img.currentSrc.includes("1520")), deviceScaleFactor === 2);
            }
            if ((width === 1920 && scheme === "dark" && deviceScaleFactor === 1 && !stress) || width === 390) {
              const beforeAccount = width >= 768 ? await anchors(page) : null;
              await page.getByRole("button", { name: "Cont", exact: true }).click();
              const menu = page.getByRole("menu", { name: "Cont", exact: true });
              assert.equal(await menu.isVisible(), true);
              const rect = await menu.boundingBox();
              assert.ok(rect.x >= 0 && rect.x + rect.width <= width, "Account menu outside viewport");
              if (beforeAccount) assertStable(beforeAccount, await anchors(page));
              await page.screenshot({ path: `${out}/REQUESTS_V6__${width === 390 ? "27_ACCOUNT_PHONE" : "26_ACCOUNT_DESKTOP"}.png`, fullPage: true });
              await page.keyboard.press("Escape");
              assert.equal(await menu.count(), 0);
              assert.equal(await page.getByRole("button", { name: "Cont", exact: true }).evaluate((button) => button === document.activeElement), true);
            }
            if (width === 1920 && scheme === "dark" && deviceScaleFactor === 1 && !stress) {
              await page.getByRole("combobox", { name: "Ordine" }).selectOption("oldest");
              assert.match(await page.locator("tbody tr").first().innerText(), /Totem dublă față/);
              await page.screenshot({ path: `${out}/REQUESTS_V6__06_SORT_OLDEST_1920x1080.png`, fullPage: true });
              await page.getByRole("button", { name: /Necesită acțiune/ }).click();
              assert.equal(await page.locator("tbody tr").count(), 2);
              await page.screenshot({ path: `${out}/REQUESTS_V6__07_ATTENTION_1920x1080.png`, fullPage: true });
              await page.getByRole("searchbox", { name: "Caută" }).fill("inexistent");
              await page.getByText("Nicio cerere nu corespunde filtrului.").waitFor();
              await page.getByRole("button", { name: /Resetează filtrele/ }).click();
              assert.equal(await page.locator("tbody tr").count(), 4);
              await page.getByRole("button", { name: "Rânduri compacte" }).click();
              assert.equal(await page.getByRole("button", { name: "Rânduri compacte" }).getAttribute("aria-pressed"), "true");
              await page.screenshot({ path: `${out}/REQUESTS_V6__08_COMPACT_1920x1080.png`, fullPage: true });
            }
            if (width === 1920 && deviceScaleFactor === 1 && !stress) {
              await page.getByRole("combobox", { name: "Ordine" }).selectOption("newest");
              if (await page.getByRole("button", { name: "Rânduri compacte" }).getAttribute("aria-pressed") === "true") {
                await page.getByRole("button", { name: "Rânduri compacte" }).click();
              }
              const row = page.getByRole("row", { name: "Previzualizează cererea: Casetă luminoasă fațadă" });
              await row.hover();
              assert.equal(await page.locator(".requests-intake__sheet").getAttribute("href"), "/cereri/req-1");
              // Settle responses caused by preceding filters/full-page captures
              // before isolating the explicit selection's network activity.
              await page.waitForLoadState("networkidle");
              const imageBefore = await page.locator(".requests-intake img").evaluate((img) => img.currentSrc);
              const imageLoadsBefore = imageResponses.length;
              const assetsBefore = imageResponses.map((response) => response.url());
              await row.locator(".requests-table__client").click();
              assert.equal(await row.getAttribute("aria-selected"), "true");
              assert.equal(await page.locator(".requests-intake img").evaluate((img) => img.getAnimations().some((animation) => animation.playState === "running")), false, "Selection replayed the entrance animation");
              assert.equal(await page.locator(".requests-intake__sheet").getAttribute("href"), "/cereri/req-2");
              await page.screenshot({ path: `${out}/REQUESTS_V6__${scheme === "dark" ? "15_SELECTED_DARK" : "16_SELECTED_LIGHT"}.png`, fullPage: true });
              const third = page.getByRole("row", { name: "Previzualizează cererea: Colantare vitrină" });
              await third.focus();
              await page.keyboard.press("Space");
              assert.equal(await page.locator(".requests-intake__sheet").getAttribute("href"), "/cereri/req-3");
              await row.focus();
              await page.keyboard.press("Enter");
              assert.equal(await page.locator(".requests-intake__sheet").getAttribute("href"), "/cereri/req-2");
              assert.equal(await page.locator(".requests-intake img").evaluate((img) => img.currentSrc), imageBefore);
              await page.waitForLoadState("networkidle");
              assert.equal(imageResponses.length, imageLoadsBefore,
                `Selection changed image requests: ${JSON.stringify({ before: assetsBefore, after: imageResponses.map((response) => response.url()) })}`);
              await page.getByRole("button", { name: /Necesită acțiune/ }).click();
              await page.getByRole("searchbox", { name: "Caută" }).fill("inexistent");
              assert.equal(await page.locator(".requests-intake__sheet").getAttribute("href"), "/cereri/req-2");
              await page.getByRole("button", { name: /Resetează filtrele/ }).click();
              // Real navigation through a row link must not become preview selection.
              await page.locator(".requests-object").filter({ hasText: "Colantare vitrină" }).click();
              await page.waitForURL("**/cereri/req-3");
              await page.goto("http://127.0.0.1:4173/cereri");
              await page.getByRole("link", { name: /Ultima intrare/ }).waitFor();
              await page.getByRole("row", { name: "Previzualizează cererea: Casetă luminoasă fațadă" }).locator(".requests-table__client").click();
              await page.getByRole("link", { name: /Cerere selectată/ }).click();
              await page.waitForURL("**/cereri/req-2");
            }
            assert.deepEqual(errors, [], "Browser console/page errors");
            await context.close();
          }

          await shot("REQUESTS_V6__01_DESKTOP_DARK_1920x1080", 1920, 1080, "dark");
          await shot("REQUESTS_V6__02_DESKTOP_LIGHT_1920x1080", 1920, 1080, "light");
          await shot("REQUESTS_V6__03_LAPTOP_DARK_1366x768", 1366, 768, "dark");
          await shot("REQUESTS_V6__04_TABLET_LIGHT_1024x768", 1024, 768, "light");
          await shot("REQUESTS_V6__05_PHONE_DARK_390x844", 390, 844, "dark");

          await shot("REQUESTS_V6__17_RETINA_DARK_1920x1080", 1920, 1080, "dark", 2);
          await shot("REQUESTS_V6__18_STRESS_DESKTOP", 1920, 1080, "dark", 1, true);
          await shot("REQUESTS_V6__19_STRESS_LAPTOP", 1366, 768, "light", 1, true);
          await shot("REQUESTS_V6__20_STRESS_1280", 1280, 800, "dark", 1, true);
          await shot("REQUESTS_V6__21_STRESS_1152", 1152, 800, "dark", 1, true);
          await shot("REQUESTS_V6__22_STRESS_TABLET", 1024, 768, "dark", 1, true);
          await shot("REQUESTS_V6__23_STRESS_768", 768, 1024, "light", 1, true);
          await shot("REQUESTS_V6__24_PHONE_320", 320, 740, "light", 1, true);
          await fs.writeFile(`${out}/IMAGE_LOADING_EVIDENCE.json`, JSON.stringify(assetEvidence, null, 2));

          const context = await browser.newContext({ timezoneId: "Europe/Bucharest", viewport: { width: 1920, height: 1080 }, reducedMotion: "reduce" });
          await context.addInitScript(() => localStorage.setItem("workos-color-scheme", "dark"));
          const page = await context.newPage();
          const reviewRows = Array.from({ length: 23 }, (_, index) => ({
            ...requests[index % requests.length],
            requestId: `review-${index + 1}`,
            reference: `REV-${String(index + 1).padStart(3, "0")}`,
            title: `Cerere de review ${String(index + 1).padStart(2, "0")}`,
            createdAt: new Date(Date.UTC(2026, 9, 6, 12) - index * 60_000).toISOString(),
          }));
          const errors = [];
          page.on("pageerror", (error) => errors.push(error.message));
          await page.route("http://127.0.0.1:4173/api/**", async (route) => {
            const url = route.request().url();
            const body = url.endsWith("/cloud/session") ? session : url.endsWith("/requests") ? { overview: { requests: reviewRows } } : { status: "ok", service: "workos-final-api", apiContractId: "workos-ui-contract-v1" };
            await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(body) });
          });
          await page.goto("http://127.0.0.1:4173/cereri");
          await page.getByRole("link", { name: /REV-001/ }).waitFor();
          await page.locator(".requests-intake img").evaluate((img) => img.decode());
          assert.equal(await page.locator("tbody tr").count(), 10);
          assert.equal(await page.locator(".requests-pagination__range").innerText(), "1–10 din 23 cereri");
          assert.equal(await page.locator(".requests-intake img").evaluate((img) => getComputedStyle(img).animationName), "none");
          await page.evaluate(() => window.scrollTo(0, 0));
          const beforeFilter = await anchors(page);
          const scrollBefore = await page.evaluate(() => document.documentElement.scrollHeight > innerHeight);
          await page.getByRole("searchbox", { name: "Caută" }).fill("nu-exista-review");
          await page.getByText("Nicio cerere nu corespunde filtrului.").waitFor();
          await page.evaluate(() => window.scrollTo(0, 0));
          const emptyFilter = await anchors(page);
          assertStable(beforeFilter, emptyFilter);
          assert.equal(await page.getByRole("columnheader").count(), 6);
          assert.equal(await page.locator(".requests-feedback").count(), 0);
          const scrollAfter = await page.evaluate(() => document.documentElement.scrollHeight > innerHeight);
          assert.equal(scrollBefore, true);
          assert.equal(scrollAfter, false);
          await page.screenshot({ path: `${out}/REQUESTS_V6__25_FILTER_EMPTY_STABLE.png`, fullPage: true, animations: "disabled" });
          await page.getByRole("button", { name: /Resetează filtrele/ }).click();
          assertStable(beforeFilter, await anchors(page));
          geometryEvidence.push({ name: "scrollbar_and_filter_stability", beforeFilter, emptyFilter, scrollBefore, scrollAfter });
          await page.screenshot({ path: `${out}/REQUESTS_V6__09_PAGINATION_PAGE_1.png`, fullPage: true, animations: "disabled" });
          await page.getByRole("button", { name: "Următor" }).focus();
          await page.keyboard.press("Enter");
          assert.equal(await page.locator(".requests-pagination__range").innerText(), "11–20 din 23 cereri");
          assert.match(await page.locator("tbody tr").first().innerText(), /review 11/);
          // Keyboard activation scrolls to the pager; restore the comparison viewport
          // before capturing composited image layers above the fold.
          await page.evaluate(() => window.scrollTo(0, 0));
          await page.evaluate(() => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve))));
          console.log("PAGE_TWO_RENDER", JSON.stringify(await page.evaluate(() => ({
            width: innerWidth, title: getComputedStyle(document.querySelector(".page-header__title")).fontSize,
            image: document.querySelector(".requests-intake img").currentSrc,
            complete: document.querySelector(".requests-intake img").complete,
            clip: getComputedStyle(document.querySelector(".requests-intake img")).clipPath,
          }))));
          await page.screenshot({ path: `${out}/REQUESTS_V6__10_PAGINATION_PAGE_2.png`, fullPage: true, animations: "disabled" });
          await page.getByRole("button", { name: "Pagina 3", exact: true }).click();
          assert.equal(await page.locator("tbody tr").count(), 3);
          assert.equal(await page.getByRole("button", { name: "Următor" }).isDisabled(), true);
          await page.getByRole("combobox", { name: "Pe pagină" }).selectOption("20");
          assert.equal(await page.locator("tbody tr").count(), 20);
          await page.getByRole("searchbox", { name: "Caută" }).fill("review 23");
          assert.equal(await page.locator("tbody tr").count(), 1);
          assert.equal(await page.getByRole("button", { name: "Pagina 1", exact: true }).getAttribute("aria-current"), "page");
          assert.deepEqual(errors, []);
          await page.setViewportSize({ width: 390, height: 844 });
          await page.getByRole("searchbox", { name: "Caută" }).fill("");
          await page.getByRole("combobox", { name: "Pe pagină" }).selectOption("10");
          assert.equal(await page.evaluate(() => document.documentElement.scrollWidth > innerWidth), false);
          await page.screenshot({ path: `${out}/REQUESTS_V6__11_PHONE_PAGINATION.png`, fullPage: true, animations: "disabled" });
          const longReview = Array.from({ length: 200 }, (_, index) => ({ ...reviewRows[index % reviewRows.length], requestId: `long-review-${index}`, reference: `REV-LONG-${index}`, title: `Cerere review extins ${index}` }));
          await page.route("http://127.0.0.1:4173/api/requests", (route) => route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ overview: { requests: longReview } }) }));
          await page.reload();
          await page.getByRole("button", { name: "Pagina 20", exact: true }).waitFor();
          await page.getByRole("button", { name: "Pagina 20", exact: true }).click();
          for (let i = 0; i < 10; i++) await page.getByRole("button", { name: "Anterior" }).click();
          assert.equal(await page.getByRole("button", { name: "Pagina 10", exact: true }).getAttribute("aria-current"), "page");
          assert.equal(await page.evaluate(() => document.documentElement.scrollWidth > innerWidth), false);
          await page.screenshot({ path: `${out}/REQUESTS_V6__14_PHONE_MANY_PAGES.png`, fullPage: true, animations: "disabled" });
          await page.route("http://127.0.0.1:4173/api/requests", (route) => route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ overview: { requests: [] } }) }));
          await page.setViewportSize({ width: 1920, height: 1080 });
          await page.reload();
          await page.getByText("Nu există cereri").waitFor();
          assert.equal(await page.getByRole("navigation", { name: "Paginare cereri" }).count(), 0);
          assert.equal(await page.getByRole("link", { name: /Ultima intrare/ }).count(), 0);
          await page.screenshot({ path: `${out}/REQUESTS_V6__12_EMPTY.png`, fullPage: true, animations: "disabled" });
          await page.route("http://127.0.0.1:4173/api/requests", (route) => route.fulfill({ status: 503, contentType: "application/json", body: JSON.stringify({ error: "synthetic-unavailable" }) }));
          await page.reload();
          await page.getByRole("alert").waitFor();
          assert.equal(await page.getByRole("navigation", { name: "Paginare cereri" }).count(), 0);
          await page.screenshot({ path: `${out}/REQUESTS_V6__13_ERROR.png`, fullPage: true, animations: "disabled" });
          await context.close();

          await fs.writeFile(`${out}/GEOMETRY_EVIDENCE.json`, JSON.stringify(geometryEvidence, null, 2));
          await browser.close();
          EOF
          node capture-requests.mjs

