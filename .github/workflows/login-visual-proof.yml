name: Login Visual Proof

on:
  push:
    branches:
      - ui/login-light-rgb-clarity-v1

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright locally for visual proof
        run: |
          pnpm add -Dw playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Start Vite
        run: |
          pnpm dev --host 127.0.0.1 --port 4173 > /tmp/workos-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/workos-vite.log
          exit 1

      - name: Capture login visual states
        run: |
          cat > capture-login.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";

          const out = "artifacts/login-visual-proof";
          await fs.mkdir(out, { recursive: true });

          const browser = await chromium.launch({ headless: true });

          async function openPage(width, height, scheme) {
            const context = await browser.newContext({
              viewport: { width, height },
              colorScheme: scheme,
              deviceScaleFactor: 1,
            });
            await context.addInitScript((value) => {
              localStorage.setItem("workos-color-scheme", value);
            }, scheme);
            const page = await context.newPage();
            page.on("console", (message) => console.log("[browser console]", message.type(), message.text()));
            page.on("pageerror", (error) => console.log("[browser pageerror]", error.message));

            await page.route("http://127.0.0.1:4173/api/**", async (route) => {
              const url = route.request().url();
              if (url.endsWith("/api/cloud/session")) {
                await route.fulfill({
                  status: 200,
                  contentType: "application/json",
                  body: JSON.stringify({
                    mode: "cloud",
                    user: null,
                    organization: null,
                    memberships: [],
                  }),
                });
                return;
              }
              if (url.endsWith("/api/health")) {
                await route.fulfill({
                  status: 200,
                  contentType: "application/json",
                  body: JSON.stringify({
                    status: "ok",
                    service: "workos-final-api",
                    apiContractId: "workos-ui-contract-v1",
                  }),
                });
                return;
              }
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({}),
              });
            });

            await page.goto("http://127.0.0.1:4173/", { waitUntil: "domcontentloaded" });
            await page.waitForTimeout(1200);
            const gateCount = await page.locator(".auth-gate").count();
            if (gateCount === 0) {
              console.log("[debug title]", await page.title());
              console.log("[debug url]", page.url());
              console.log("[debug body]", (await page.locator("body").innerText()).slice(0, 4000));
              await page.screenshot({ path: `${out}/00-debug-missing-auth-gate.png`, fullPage: true });
              throw new Error("auth_gate_missing");
            }
            return { context, page };
          }

          async function shot(name, width, height, scheme, mutate) {
            const { context, page } = await openPage(width, height, scheme);
            if (mutate) await mutate(page);
            await page.screenshot({ path: `${out}/${name}.png`, fullPage: true });
            await context.close();
          }

          await shot("01-desktop-dark-idle-1920x1080", 1920, 1080, "dark");

          await shot("02-desktop-dark-rgb-1920x1080", 1920, 1080, "dark", async (page) => {
            await page.getByRole("radio", { name: "RGB" }).click();
            await page.getByRole("radiogroup", { name: "Culoare RGB" }).waitFor();
          });

          await shot("03-desktop-light-idle-1920x1080", 1920, 1080, "light");

          await shot("03b-desktop-light-rgb-1920x1080", 1920, 1080, "light", async (page) => {
            await page.getByRole("switch", { name: "Alimentare iluminare WorkOS" }).click();
            await page.getByRole("radio", { name: "RGB" }).click();
            await page.getByRole("radiogroup", { name: "Culoare RGB" }).waitFor();
          });

          await shot("04-desktop-dark-login-societate-1920x1080", 1920, 1080, "dark", async (page) => {
            await page.getByRole("button", { name: "Login Societate" }).click();
            await page.getByLabel("Adresă email").waitFor();
          });

          await shot("05-desktop-light-login-societate-1920x1080", 1920, 1080, "light", async (page) => {
            await page.getByRole("button", { name: "Login Societate" }).click();
            await page.getByLabel("Adresă email").waitFor();
          });

          await shot("06-tablet-light-login-societate-1024x768", 1024, 768, "light", async (page) => {
            await page.getByRole("button", { name: "Login Societate" }).click();
            await page.getByLabel("Adresă email").waitFor();
          });

          await shot("07-phone-light-login-societate-390x844", 390, 844, "light", async (page) => {
            await page.getByRole("button", { name: "Login Societate" }).click();
            await page.getByLabel("Adresă email").waitFor();
          });

          await shot("08-phone-dark-login-societate-390x844", 390, 844, "dark", async (page) => {
            await page.getByRole("button", { name: "Login Societate" }).click();
            await page.getByLabel("Adresă email").waitFor();
          });

          await browser.close();
          EOF
          node capture-login.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-visual-proof
          path: artifacts/login-visual-proof/*.png
          if-no-files-found: error
          retention-days: 3
