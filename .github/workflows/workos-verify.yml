name: WorkOS Verify

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: WorkOS Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.15.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Test PR traceability metadata
        if: github.event_name == 'pull_request'
        run: node --test scripts/verify-pr-traceability.test.mjs

      - name: PR traceability metadata
        if: github.event_name == 'pull_request'
        run: node scripts/verify-pr-traceability.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify:all
