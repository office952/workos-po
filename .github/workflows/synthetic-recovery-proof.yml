name: WorkOS Synthetic Recovery Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/synthetic-recovery-proof.yml"
      - "apps/api/tests/backup-restore.test.ts"
      - "apps/api/tests/cloud-runtime-recovery.test.ts"
      - "apps/api/src/cloud/backup.ts"
      - "apps/api/src/cloud/restore.ts"
      - "apps/api/src/ops/runtimeLease.ts"
      - "apps/api/src/ops/readiness.ts"

permissions:
  contents: read

concurrency:
  group: synthetic-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-recovery:
    name: Isolated backup and restore regression proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      WORKOS_CLOUD_ROOT: ""
      WORKOS_BACKUP_ROOT: ""
      WORKOS_PUBLIC_ORIGIN: ""
      WORKOS_TRUSTED_ORIGINS: ""
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run isolated synthetic backup and recovery suites
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @workos-final/api exec vitest run \
            tests/backup-restore.test.ts \
            tests/cloud-runtime-recovery.test.ts

      - name: Publish evidence summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## WorkOS synthetic recovery regression proof"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Runner: ephemeral GitHub-hosted Ubuntu"
            echo "- Result: **$JOB_STATUS**"
            echo "- Scope: existing synthetic backup/restore and Cloud runtime recovery test suites"
            echo "- No production credentials, real Cloud roots, deployment, or real business data"
            echo "- Classification: automated synthetic regression proof; NOT an independently witnessed operator drill or real-environment preflight"
          } >> "$GITHUB_STEP_SUMMARY"
